name: Lagebild aktualisieren

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modus:
        description: "voll = alle Quellen, oepnv = nur Abfahrten (schnell)"
        required: false
        default: "voll"
      urls:
        description: "nur für Modus probe"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html app.js sw.js manifest.webmanifest icons README.md .nojekyll _site/
          mkdir -p _site/data && cp static/*.json _site/data/
      - name: Daten sammeln
        env:
          MODUS: ${{ github.event.inputs.modus || 'voll' }}
          PROBE_URLS: ${{ github.event.inputs.urls || '' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'lagebild-thh-de66cb14565a' }}
        run: node tools/collect.mjs _site/data
      - uses: actions/upload-pages-artifact@v3
        if: github.event.inputs.modus != 'probe'
        with:
          path: _site
  veroeffentlichen:
    needs: bauen
    if: github.event.inputs.modus != 'probe'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
